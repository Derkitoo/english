            { id: 5, type: 'en_to_fr', question: "Que signifie 'Did you find us alright?'", options: ["Allez-vous bien ?", "Cherchez-vous quelque chose ?", "Avez-vous trouvé nos locaux facilement ?", "Est-ce le bon endroit ?"], correctAnswer: "Avez-vous trouvé nos locaux facilement ?", englishText: "Did you find us alright?" },
            { id: 6, type: 'fr_to_en', question: "Traduisez : 'Laissez-moi prendre votre manteau.'", options: ["Give me coat.", "Let me get your coat.", "I take your jacket.", "Can I have your coat?"], correctAnswer: "Let me get your coat.", englishText: "Let me get your coat." }

          phone: [
            { id: 1, type: 'fr_to_en', question: "Traduisez : 'Pourrais-je parler à Meryl, s'il vous plaît ?'", options: ["I want Meryl.", "Could I speak to Meryl, please?", "Give me Meryl.", "Meryl is here?"], correctAnswer: "Could I speak to Meryl, please?", englishText: "Could I speak to Meryl, please?" },

            { id: 3, type: 'fr_to_en', question: "Traduisez : 'Je crains que la ligne soit très mauvaise.'", options: ["The line is bad.", "I'm afraid the line is very bad.", "Telephone is not good.", "Sorry for the line."], correctAnswer: "I'm afraid the line is very bad.", englishText: "I'm afraid the line is very bad." },
            { id: 4, type: 'en_to_fr', question: "Que veut dire 'Can I leave a message?'", options: ["Puis-je lire un message ?", "Avez-vous un message ?", "Puis-je laisser un message ?", "Où est le message ?"], correctAnswer: "Puis-je laisser un message ?", englishText: "Can I leave a message?" },

            { id: 5, type: 'fr_to_en', question: "Comment commencer un email par : 'Suite à votre demande téléphonique...'", options: ["After your call...", "Following your call...", "Further to your telephone enquiry...", "About your telephone..."], correctAnswer: "Further to your telephone enquiry...", englishText: "Further to your telephone enquiry..." },

          ],
          career: [
            { id: 1, type: 'fr_to_en', question: "Traduisez : 'J'ai un diplôme de Master.'", options: ["I have a Master.", "I am Master degree.", "I hold a Master's degree.", "My diploma is Master."], correctAnswer: "I hold a Master's degree.", englishText: "I hold a Master's degree." },
            { id: 2, type: 'en_to_fr', question: "Que signifie 'I am a team player.' ?", options: ["Je joue dans une équipe.", "J'aime le sport.", "Je suis le capitaine.", "J'ai l'esprit d'équipe."], correctAnswer: "J'ai l'esprit d'équipe.", englishText: "I am a team player." },
            { id: 3, type: 'fr_to_en', question: "Comment dire : 'Je me suis spécialisé en anglais.'", options: ["I am special in English.", "I majored in English.", "My subject is English.", "I study English special."], correctAnswer: "I majored in English.", englishText: "I majored in English." },
            { id: 4, type: 'en_to_fr', question: "Que signifie 'I am currently looking for a job.'", options: ["Je regarde mon travail.", "Je recherche actuellement un emploi.", "J'ai trouvé un travail.", "Mon emploi actuel est bon."], correctAnswer: "Je recherche actuellement un emploi.", englishText: "I am currently looking for a job." },
            { id: 5, type: 'fr_to_en', question: "Traduisez : 'Je suis responsable du recrutement.'", options: ["I am responsible for recruiting.", "I make recruitment.", "My job is recruit.", "I am the recruiter boss."], correctAnswer: "I am responsible for recruiting.", englishText: "I am responsible for recruiting." },
            { id: 6, type: 'en_to_fr', question: "Que veut dire 'My job involves a lot of travelling.'", options: ["J'aime voyager pour le travail.", "Je vais au travail en voiture.", "Mon travail implique beaucoup de déplacements.", "Le voyage est mon métier."], correctAnswer: "Mon travail implique beaucoup de déplacements.", englishText: "My job involves a lot of travelling." }
          ],
          meetings: [
            { id: 1, type: 'fr_to_en', question: "Traduisez : 'À mon avis...'", options: ["To my idea...", "For my thought...", "In my opinion...", "To my head..."], correctAnswer: "In my opinion...", englishText: "In my opinion..." },
            { id: 2, type: 'en_to_fr', question: "Que signifie 'Sorry to interrupt, but...'", options: ["Désolé d'interrompre, mais...", "Je ne veux pas parler, mais...", "Excusez mon retard, mais...", "Pardon, je m'en vais."], correctAnswer: "Désolé d'interrompre, mais...", englishText: "Sorry to interrupt, but..." },
            { id: 3, type: 'fr_to_en', question: "Comment exprimer : 'Je suis d'accord avec vous jusqu'à un certain point.'", options: ["I agree with you to a point.", "I agree with you up to a point.", "I say yes for a point.", "You are right sometimes."], correctAnswer: "I agree with you up to a point.", englishText: "I agree with you up to a point." },
            { id: 4, type: 'en_to_fr', question: "Que signifie 'The aim of this meeting is to discuss...'", options: ["La réunion parle de...", "Nous sommes ici pour...", "Le but de cette réunion est de discuter de...", "Il faut discuter de..."], correctAnswer: "Le but de cette réunion est de discuter de...", englishText: "The aim of this meeting is to discuss..." },
            { id: 5, type: 'fr_to_en', question: "Demandez poliment : 'Qu'en pensez-vous ?'", options: ["What you think?", "What are your thoughts on this?", "Do you have ideas?", "Give your opinion."], correctAnswer: "What are your thoughts on this?", englishText: "What are your thoughts on this?" },
            { id: 6, type: 'en_to_fr', question: "Que veut dire 'Let's go over the main points.'", options: ["Oublions les détails.", "Passons en revue les points principaux.", "Regardez les points.", "Finissons la réunion."], correctAnswer: "Passons en revue les points principaux.", englishText: "Let's go over the main points." }
          ],
          problems: [
            { id: 1, type: 'fr_to_en', question: "Comment demander : 'Pardon, avez-vous dit 13 ou 30 ?'", options: ["You said 13 or 30?", "Sorry, did you say 13 or 30?", "Repeat 13 or 30?", "13 or 30?"], correctAnswer: "Sorry, did you say 13 or 30?", englishText: "Sorry, did you say 13 or 30?" },
            { id: 2, type: 'en_to_fr', question: "Que signifie 'I'm afraid something has come up.'", options: ["J'ai peur de quelque chose.", "Je crains qu'un imprévu ne soit survenu.", "Quelque chose monte.", "Je ne peux pas monter."], correctAnswer: "Je crains qu'un imprévu ne soit survenu.", englishText: "I'm afraid something has come up." },
            { id: 3, type: 'fr_to_en', question: "Traduisez : 'Que voulez-vous dire exactement par là ?'", options: ["What mean you?", "What exactly do you mean by that?", "How you explain this?", "Say exactly."], correctAnswer: "What exactly do you mean by that?", englishText: "What exactly do you mean by that?" },
            { id: 4, type: 'en_to_fr', question: "Que veut dire 'If I've understood you correctly...'", options: ["Si je comprends bien l'anglais...", "Avez-vous bien compris ?", "Si j'ai bien compris...", "Pour vous faire comprendre..."], correctAnswer: "Si j'ai bien compris...", englishText: "If I've understood you correctly..." },
            { id: 5, type: 'fr_to_en', question: "Exprimez : 'Il semble y avoir une erreur sur le contrat.'", options: ["Error in contract.", "There seems to be a mistake on the contract.", "You made a mistake.", "Contract is wrong."], correctAnswer: "There seems to be a mistake on the contract.", englishText: "There seems to be a mistake on the contract." },
            { id: 6, type: 'en_to_fr', question: "Que signifie 'Could we reschedule the meeting?'", options: ["Pouvons-nous annuler la réunion ?", "Pouvons-nous reprogrammer la réunion ?", "Où est la réunion ?", "Quand est la réunion ?"], correctAnswer: "Pouvons-nous reprogrammer la réunion ?", englishText: "Could we reschedule the meeting?" }
          ],
          culture: [
            { id: 1, type: 'fr_to_en', question: "Comment demander poliment : 'Cela vous dérangerait-il de prendre mes appels ?'", options: ["Take my calls?", "Would you mind taking my phone calls?", "Do you take calls?", "Please phone calls."], correctAnswer: "Would you mind taking my phone calls?", englishText: "Would you mind taking my phone calls?" },

            { id: 3, type: 'fr_to_en', question: "Demandez la permission : 'Cela vous dérange-t-il si je me joins à vous ?'", options: ["Do you mind if I join you?", "Can I sit?", "I join you?", "Is it a problem to sit?"], correctAnswer: "Do you mind if I join you?", englishText: "Do you mind if I join you?" },

            { id: 5, type: 'fr_to_en', question: "Traduisez (style formel) : 'Je me demandais si vous pouviez m'aider.'", options: ["Can you help me?", "I want help.", "I was wondering if you could help me.", "Please help me."], correctAnswer: "I was wondering if you could help me.", englishText: "I was wondering if you could help me." },
            { id: 6, type: 'en_to_fr', question: "Que signifie 'That's a rather personal question.'", options: ["C'est une personne qui pose une question.", "C'est une question plutôt personnelle.", "Je ne réponds pas aux questions.", "Quelle drôle de question !"], correctAnswer: "C'est une question plutôt personnelle.", englishText: "That's a rather personal question." }
          ]
        };

        function EnglishLearningApp() {
          const [screen, setScreen] = useState('start'); // 'start', 'playing', 'won', 'lost'
          const [selectedCategory, setSelectedCategory] = useState(null);
          const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [feedback, setFeedback] = useState(null);
          const [lives, setLives] = useState(3);
          const [score, setScore] = useState(0);

          const currentQuestions = selectedCategory ? LESSON_DATA[selectedCategory] : [];
          const currentQuestion = currentQuestions[currentQuestionIndex];
          const progressPercentage = screen === 'playing' && currentQuestions.length > 0 ? ((currentQuestionIndex) / currentQuestions.length) * 100 : 0;

          const playAudio = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'en-US';
              utterance.rate = 0.9;
              window.speechSynthesis.speak(utterance);
            }
          };

          useEffect(() => {
            if (screen === 'playing' && currentQuestion && currentQuestion.type === 'en_to_fr' && feedback === null) {
                playAudio(currentQuestion.englishText);
            }
          }, [currentQuestionIndex, screen, feedback, currentQuestion]);

          const startGame = (categoryId) => {
            setSelectedCategory(categoryId);
            setCurrentQuestionIndex(0);
            setSelectedOption(null);
            setFeedback(null);
            setLives(3);
            setScore(0);
            setScreen('playing');
          };

          const goHome = () => {
            setScreen('start');
            setSelectedCategory(null);
          };

          const handleOptionClick = (option) => {
            if (feedback !== null) return;
            setSelectedOption(option);
            
            if (currentQuestion.type === 'fr_to_en') {
              playAudio(option);
            }
          };

          const handleCheck = () => {
            if (!selectedOption) return;

            if (selectedOption === currentQuestion.correctAnswer) {
              setFeedback('correct');
              setScore(score + 20);
              playAudio(currentQuestion.englishText);
            } else {
              setFeedback('incorrect');
              setLives(lives - 1);
              if (lives - 1 <= 0) {
                setTimeout(() => setScreen('lost'), 1500);
              }
            }
          };

          const handleNext = () => {
            if (currentQuestionIndex + 1 < currentQuestions.length) {
              setCurrentQuestionIndex(currentQuestionIndex + 1);
              setSelectedOption(null);
              setFeedback(null);
            } else {
              setScreen('won');
            }
          };

          if (screen === 'start') {
            return (
              <div className="min-h-screen bg-gradient-to-b from-blue-700 to-blue-900 flex flex-col items-center justify-center p-6 font-sans text-white">
                <div className="text-7xl mb-6 animate-bounce">💼</div>
                <h1 className="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight text-center">EnglishQuest Pro</h1>
                <p className="text-xl mb-10 font-medium text-blue-100 text-center max-w-lg">
                  Sélectionnez une situation professionnelle issue du livre "Être pro en anglais" pour commencer l'entraînement :
                </p>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-3xl">
                  {CATEGORIES.map(cat => (
                    <button 
                      key={cat.id}
                      onClick={() => startGame(cat.id)}
                      className="bg-white text-gray-800 rounded-2xl p-6 text-left shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all border-b-6 border-gray-300 active:border-b-0 active:translate-y-2 flex items-center space-x-5"
                    >
                      <div className="text-5xl">{cat.icon}</div>
                      <div>
                        <h3 className="text-2xl font-bold text-blue-800 mb-1">{cat.title}</h3>
                        <p className="text-sm text-gray-500 font-medium">{cat.desc}</p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            );
          }

          if (screen === 'won') {
            return (
              <div className="min-h-screen bg-green-50 flex flex-col items-center justify-center p-6 font-sans">
                <div className="bg-white rounded-3xl p-8 shadow-2xl max-w-md w-full text-center border-b-8 border-green-200">
                  <div className="text-7xl mb-4">🏆</div>
                  <h1 className="text-4xl font-extrabold text-green-600 mb-2">Module Terminé !</h1>
                  <p className="text-gray-600 mb-8 font-medium text-lg">Vous maîtrisez parfaitement ce vocabulaire professionnel.</p>
                  <div className="flex justify-center space-x-6 mb-10">
                    <div className="bg-yellow-100 p-4 rounded-2xl flex flex-col items-center w-28 border-b-4 border-yellow-300">
                      <span className="text-3xl mb-1">⭐</span>
                      <span className="font-extrabold text-yellow-600 text-xl">{score} XP</span>
                    </div>
                    <div className="bg-red-100 p-4 rounded-2xl flex flex-col items-center w-28 border-b-4 border-red-300">
                      <span className="text-3xl mb-1">❤️</span>
                      <span className="font-extrabold text-red-500 text-xl">{lives} restants</span>
                    </div>
                  </div>
                  <button 
                    onClick={goHome}
                    className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold text-xl border-b-4 border-blue-800 transition-all active:border-b-0 active:translate-y-1"
                  >
                    Menu Principal
                  </button>
                </div>
              </div>
            );
          }

          if (screen === 'lost') {
            return (
              <div className="min-h-screen bg-red-50 flex flex-col items-center justify-center p-6 font-sans">
                <div className="bg-white rounded-3xl p-8 shadow-2xl max-w-md w-full text-center border-b-8 border-red-200">
                  <div className="text-7xl mb-4">💔</div>
                  <h1 className="text-4xl font-extrabold text-red-500 mb-2">Plus de vies !</h1>
                  <p className="text-gray-600 mb-8 font-medium text-lg">Ne vous découragez pas, la communication s'améliore avec la pratique.</p>
                  <div className="flex space-x-4">
                    <button 
                      onClick={() => startGame(selectedCategory)}
                      className="flex-1 py-4 bg-red-500 hover:bg-red-400 text-white rounded-2xl font-bold text-lg border-b-4 border-red-700 transition-all active:border-b-0 active:translate-y-1"
                    >
                      Réessayer
                    </button>
                    <button 
                      onClick={goHome}
                      className="flex-1 py-4 bg-gray-500 hover:bg-gray-400 text-white rounded-2xl font-bold text-lg border-b-4 border-gray-700 transition-all active:border-b-0 active:translate-y-1"
                    >
                      Menu
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-white flex flex-col font-sans text-gray-800">
              
              <header className="flex items-center justify-between p-4 max-w-4xl w-full mx-auto mt-2 md:mt-6">
                <div className="flex-1 mr-6">
                  <div className="h-4 md:h-5 bg-gray-200 rounded-full w-full overflow-hidden">
                    <div 
                      className="h-full bg-green-500 transition-all duration-500 ease-out relative"
                      style={{ width: `${progressPercentage}%` }}
                    >
                      <div className="absolute top-1 left-2 right-2 h-1.5 bg-white opacity-30 rounded-full"></div>
                    </div>
                  </div>
                </div>
                <div className="flex items-center space-x-2 font-bold text-red-500 text-2xl bg-white p-2 rounded-xl">
                  <span>❤️</span>
                  <span>{lives}</span>
                </div>
              </header>

              <main className="flex-1 flex flex-col items-center justify-center p-6 max-w-3xl w-full mx-auto">
                <h2 className="text-3xl md:text-4xl font-extrabold mb-10 text-center text-gray-800 leading-tight">
                  {currentQuestion.question}
                </h2>
                
                {currentQuestion.type === 'en_to_fr' && (
                  <button 
                    onClick={() => playAudio(currentQuestion.englishText)}
                    className="mb-10 w-20 h-20 bg-blue-500 text-white rounded-2xl shadow-sm border-b-4 border-blue-700 flex items-center justify-center text-4xl hover:bg-blue-400 active:border-b-0 active:translate-y-1 transition-all cursor-pointer"
                    title="Écouter la prononciation"
                  >
                    🔊
                  </button>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                  {currentQuestion.options.map((option, index) => {
                    
                    let buttonClasses = "p-5 border-2 rounded-2xl text-xl font-bold transition-all text-center flex items-center justify-center min-h-[80px] ";
                    
                    if (feedback === null) {
                      if (selectedOption === option) {
                        buttonClasses += "border-blue-400 bg-blue-50 text-blue-500 translate-y-1 shadow-none";
                      } else {
                        buttonClasses += "border-gray-200 bg-white text-gray-700 hover:bg-gray-50 border-b-4 hover:-translate-y-0.5 cursor-pointer";
                      }
                    } else {
                      if (option === currentQuestion.correctAnswer) {
                        buttonClasses += "border-green-500 bg-green-50 text-green-600 border-b-4";
                      } else if (selectedOption === option && selectedOption !== currentQuestion.correctAnswer) {
                        buttonClasses += "border-red-500 bg-red-50 text-red-600 border-b-4";
                      } else {
                        buttonClasses += "border-gray-200 bg-gray-50 text-gray-400 opacity-50";
                      }
                    }

                    return (
                      <button
                        key={index}
                        onClick={() => handleOptionClick(option)}
                        className={buttonClasses}
                        disabled={feedback !== null}
                      >
                        {option}
                      </button>
                    );
                  })}
                </div>
              </main>

              <footer className={`p-6 md:p-8 mt-auto border-t-2 transition-colors duration-300 ${
                  feedback === 'correct' ? 'bg-green-100 border-green-200' :
                  feedback === 'incorrect' ? 'bg-red-100 border-red-200' :
                  'bg-white border-gray-100'
                }`}
              >
                <div className="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between">
                  
                  <div className="mb-6 md:mb-0 w-full md:w-auto">
                    {feedback === 'correct' && (
                      <div className="flex items-center text-green-600 font-extrabold text-2xl md:text-3xl">
                        <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center mr-4 text-green-500 shadow-sm">✓</div>
                        Excellent !
                      </div>
                    )}
                    {feedback === 'incorrect' && (
                      <div className="flex items-center text-red-600 font-extrabold text-xl md:text-2xl">
                        <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center mr-4 text-red-500 shadow-sm flex-shrink-0">✗</div>
                        <div>
                          <div className="text-red-400 text-sm md:text-base uppercase tracking-wider mb-1">La bonne réponse était :</div>
                          <div className="text-red-600">{currentQuestion.correctAnswer}</div>
                        </div>
                      </div>
                    )}
                  </div>

                  <button
                    onClick={feedback === null ? handleCheck : handleNext}
                    disabled={!selectedOption && feedback === null}
                    className={`w-full md:w-48 px-8 py-4 rounded-2xl font-bold text-lg border-b-4 transition-all uppercase tracking-wide
                      ${!selectedOption && feedback === null 
                        ? 'bg-gray-200 text-gray-400 border-gray-300 cursor-not-allowed' 
                        : feedback === 'correct'
                        ? 'bg-green-500 hover:bg-green-400 text-white border-green-700 active:border-b-0 active:translate-y-1'
                        : feedback === 'incorrect'
                        ? 'bg-red-500 hover:bg-red-400 text-white border-red-700 active:border-b-0 active:translate-y-1'
                        : 'bg-green-500 hover:bg-green-400 text-white border-green-700 active:border-b-0 active:translate-y-1'
                      }
                    `}
                  >
                    {feedback === null ? 'Vérifier' : 'Continuer'}
                  </button>
                </div>
              </footer>
            </div>
          );
        }

        // Montage de l'application React dans le DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnglishLearningApp />);
    </script>
</body>
</html>
